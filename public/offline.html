<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#110e22"/>
  <title>Sem conexão — WeedReset</title>
  <style>
    * {box-sizing:border-box}
    body{margin:0;min-height:100dvh;background:#090916;color:#f7f5ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}
    main{max-width:440px;padding:28px;border:1px solid #413558;background:#1a162a;border-radius:20px;text-align:center}
    h1{font-size:22px;line-height:1.3;margin:0 0 12px}
    p{font-size:14px;line-height:1.6;color:#c8c0d8}
    button{margin-top:14px;border:0;border-radius:12px;min-height:48px;padding:0 20px;background:#bba4ff;color:#160f27;font-weight:700;font-size:14px;cursor:pointer}
    .symbol{font-size:32px;margin-bottom:16px}
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">✦</div>
    <h1>Você está sem conexão</h1>
    <p>Seus registros pessoais não são guardados pelo sistema de cache. Verifique a internet para sincronizar e continuar sua jornada no WeedReset.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
