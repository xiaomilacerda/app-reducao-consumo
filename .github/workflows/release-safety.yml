name: Release safety checks

on:
  push:
    branches: [main, release/playstore-hardening-20261110]
  pull_request:

permissions:
  contents: read

jobs:
  release-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate Play Store graphics (not yet approved)
        run: npm run assets:playstore
      - name: Upload generated artwork for visual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weedreset-playstore-artwork
          path: store-assets/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Release security regression checks
        run: npm run test:release
      - name: TypeScript strict validation (required)
        run: npm run typecheck
      - name: ESLint check (required; legacy any warnings tracked)
        run: npm run lint
